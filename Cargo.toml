[package]
name = "sprint-core-service"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["migration"]

[workspace.dependencies]
tokio = "1.54.1"

[dependencies]
sea-orm = { version = "2.0.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
axum = "0.8.9"
dotenvy = "0.15.7"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { workspace = true, features = ["full"] }
